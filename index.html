<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Configuración para que en iPhone parezca una App real -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Toma de Datos - Bomberos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f3f5; -webkit-tap-highlight-color: transparent; }
        .card { border-top: 5px solid #e03131; border-radius: 10px; }
        .form-label { font-weight: bold; color: #495057; margin-bottom: 2px; font-size: 0.9rem; }
        .seccion-dinamica { background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; }
        .vehiculo-block { background-color: #ffffff; border: 1px dashed #adb5bd; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .btn-eliminar { position: absolute; top: 10px; right: 10px; padding: 2px 10px; font-size: 0.8rem; }
        .bg-transporte { background-color: #fff9db; border-left: 4px solid #fcc419; }
    </style>
</head>
<body>

<div class="container my-4">
    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0">RELEVAMIENTO DE DATOS</h4>
        </div>
        <div class="card-body">
            <form id="formDatos">
                
                <div class="mb-4">
                    <label for="tipoSiniestro" class="form-label text-danger">Tipo de escenario:</label>
                    <select id="tipoSiniestro" class="form-select form-select-lg" onchange="alternarSecciones()">
                        <option value="">-- Seleccionar --</option>
                        <option value="vehiculo">Vehículo/s Involucrado/s</option>
                        <option value="inmueble">Inmueble Involucrado</option>
                        <option value="otro">Otro tipo de intervención</option>
                    </select>
                </div>

                <!-- SECCIÓN VEHÍCULOS -->
                <div id="secVehiculos" class="seccion-dinamica mb-4 d-none">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="text-primary mb-0">Datos de Vehículos</h5>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarVehiculo()">+ Agregar Vehículo</button>
                    </div>
                    <div id="contenedorVehiculos"></div>
                </div>

                <!-- SECCIÓN INMUEBLES -->
                <div id="secInmuebles" class="seccion-dinamica mb-4 d-none">
                    <h5 class="text-success border-bottom pb-2">Datos del Inmueble</h5>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccionInmueble" class="form-control" placeholder="Calle y número">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de edificación</label>
                        <input type="text" id="tipoVivienda" class="form-control" placeholder="Ej: Vivienda, Taller, Local">
                    </div>
                </div>

                <!-- SECCIÓN OTRO -->
                <div id="secOtro" class="seccion-dinamica mb-4 d-none" style="background-color: #fff4e6;">
                    <h5 class="text-warning border-bottom pb-2">Otro tipo de Servicio</h5>
                    <div class="mb-3">
                        <label class="form-label">Descripción del escenario</label>
                        <textarea id="detalleOtro" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Persona involucrada / Responsable</label>
                        <textarea id="datosPersonaOtro" class="form-control" rows="2"></textarea>
                    </div>
                </div>

                <!-- SECCIÓN COLABORADORES -->
                <div class="seccion-dinamica mb-4">
                    <h5 class="text-secondary border-bottom pb-2">Servicios Colaboradores</h5>
                    <div class="row mb-2">
                        <div class="col-6"><input type="text" id="policiaMovil" class="form-control" placeholder="Policía (Móvil)"></div>
                        <div class="col-6"><input type="text" id="policiaCargo" class="form-control" placeholder="Encargado"></div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6"><input type="text" id="glpMovil" class="form-control" placeholder="GLP (Móvil)"></div>
                        <div class="col-6"><input type="text" id="glpCargo" class="form-control" placeholder="Encargado"></div>
                    </div>
                    <div class="mb-2">
                        <input type="text" id="ambulanciaMoviles" class="form-control" placeholder="Ambulancias (Móviles)">
                    </div>
                    <textarea id="otrosServicios" class="form-control" rows="2" placeholder="Otros (Tránsito, EPEC, etc.)"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-success btn-lg" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="location.reload()">Limpiar Formulario</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let vehiculoCount = 0;

    function alternarSecciones() {
        const tipo = document.getElementById('tipoSiniestro').value;
        document.getElementById('secVehiculos').classList.add('d-none');
        document.getElementById('secInmuebles').classList.add('d-none');
        document.getElementById('secOtro').classList.add('d-none');

        if (tipo === 'vehiculo') {
            document.getElementById('secVehiculos').classList.remove('d-none');
            if(vehiculoCount === 0) agregarVehiculo();
        }
        if (tipo === 'inmueble') document.getElementById('secInmuebles').classList.remove('d-none');
        if (tipo === 'otro') document.getElementById('secOtro').classList.remove('d-none');
    }

    function agregarVehiculo() {
        vehiculoCount++;
        const div = document.createElement('div');
        div.className = 'vehiculo-block';
        div.id = `v-block-${vehiculoCount}`;
        div.innerHTML = `
            <button type="button" class="btn btn-outline-danger btn-eliminar" onclick="eliminarVehiculo(${vehiculoCount})">X</button>
            <h6 class="text-muted small">VEHÍCULO ${vehiculoCount}</h6>
            <div class="row g-2 mb-2">
                <div class="col-7">
                    <label class="form-label">Marca/Modelo y Dominio</label>
                    <input type="text" class="form-control v-marca">
                </div>
                <div class="col-5">
                    <label class="form-label">Tipo Uso</label>
                    <select class="form-select v-uso" onchange="toggleOblea(${vehiculoCount}, this.value)">
                        <option value="Particular">Particular</option>
                        <option value="Taxi">Taxi</option>
                        <option value="Remis">Remis</option>
                    </select>
                </div>
            </div>
            <div id="oblea-div-${vehiculoCount}" class="d-none mb-2 p-2 bg-transporte rounded">
                <label class="form-label">Número de Oblea</label>
                <input type="text" class="form-control v-oblea">
            </div>
            <div class="p-2 border rounded bg-light mb-2">
                <p class="mb-1 fw-bold small text-primary">CONDUCTOR</p>
                <input type="text" class="form-control mb-1 v-conductor" placeholder="Nombre">
                <div class="row g-1 mb-1">
                    <div class="col-6"><input type="text" class="form-control v-dni" placeholder="DNI"></div>
                    <div class="col-6"><input type="text" class="form-control v-domicilio" placeholder="Dom."></div>
                </div>
                <select class="form-select form-select-sm v-es-titular" onchange="toggleTitular(${vehiculoCount}, this.value)">
                    <option value="Si">¿Es titular? SÍ</option>
                    <option value="No">¿Es titular? NO</option>
                </select>
                <div id="titular-extra-${vehiculoCount}" class="d-none mt-2 p-2 border-start border-warning border-4">
                    <input type="text" class="form-control v-titular-nombre" placeholder="Nombre del Titular">
                </div>
            </div>
            <textarea class="form-control v-ocupantes mb-2" rows="2" placeholder="Otros ocupantes..."></textarea>
            <input type="text" class="form-control v-seguro" placeholder="Seguro / Compañía">
        `;
        document.getElementById('contenedorVehiculos').appendChild(div);
    }

    function eliminarVehiculo(id) { document.getElementById(`v-block-${id}`).remove(); }
    function toggleOblea(id, valor) {
        const div = document.getElementById(`oblea-div-${id}`);
        valor !== 'Particular' ? div.classList.remove('d-none') : div.classList.add('d-none');
    }
    function toggleTitular(id, valor) {
        const div = document.getElementById(`titular-extra-${id}`);
        valor === 'No' ? div.classList.remove('d-none') : div.classList.add('d-none');
    }

    function armarMensaje() {
        const tipo = document.getElementById('tipoSiniestro').value;
        if (!tipo) return null;
        let m = `*DATOS RECABADOS EN EL LUGAR*\n----------------------------------\n`;
        if (tipo === 'vehiculo') {
            document.querySelectorAll('.vehiculo-block').forEach((b, index) => {
                const uso = b.querySelector('.v-uso').value;
                m += `\n🚗 *VEHÍCULO ${index + 1} (${uso})*\n`;
                m += `• *Unidad/Patente:* ${b.querySelector('.v-marca').value}\n`;
                if(uso !== 'Particular') m += `• *N° Oblea:* ${b.querySelector('.v-oblea').value}\n`;
                m += `• *Conductor:* ${b.querySelector('.v-conductor').value}\n`;
                m += `• *DNI:* ${b.querySelector('.v-dni').value} | *Dom:* ${b.querySelector('.v-domicilio').value}\n`;
                const esTit = b.querySelector('.v-es-titular').value;
                if(esTit === 'No') m += `  └ *Titular:* ${b.querySelector('.v-titular-nombre').value}\n`;
                m += `• *Ocupantes:* ${b.querySelector('.v-ocupantes').value}\n`;
                m += `• *Seguro:* ${b.querySelector('.v-seguro').value}\n`;
            });
        } else if (tipo === 'inmueble') {
            m += `🏠 *INMUEBLE*\n• *Dirección:* ${document.getElementById('direccionInmueble').value}\n• *Tipo:* ${document.getElementById('tipoVivienda').value}\n`;
        } else if (tipo === 'otro') {
            m += `⚠️ *OTRO SERVICIO*\n• *Detalle:* ${document.getElementById('detalleOtro').value}\n• *Responsable:* ${document.getElementById('datosPersonaOtro').value}\n`;
        }
        m += `\n🤝 *COLABORADORES*\n`;
        const pol = document.getElementById('policiaMovil').value;
        if (pol) m += `• Pol: Móvil ${pol} (Cargo: ${document.getElementById('policiaCargo').value})\n`;
        const glp = document.getElementById('glpMovil').value;
        if (glp) m += `• GLP: Móvil ${glp} (Cargo: ${document.getElementById('glpCargo').value})\n`;
        const amb = document.getElementById('ambulanciaMoviles').value;
        if (amb) m += `• Amb: ${amb}\n`;
        const otros = document.getElementById('otrosServicios').value;
        if (otros) m += `• Otros: ${otros}\n`;
        return m;
    }

    function enviarWhatsApp() {
        const msg = armarMensaje();
        if (!msg) { alert("Seleccioná un tipo de intervención."); return; }
        // Cambio clave para iPhone: window.location en vez de window.open
        const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.location.href = url;
    }
</script>

</body>
</html>
